services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: Mutiur
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Mutiur -d db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db
      SPRING_DATASOURCE_USERNAME: Mutiur
      SPRING_DATASOURCE_PASSWORD: postgres
      APP_JWT_SECRET: ${JWT_SECRET:-change-this-development-secret}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
